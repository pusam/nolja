<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>놀자</title>
<link rel="stylesheet" href="shared/nolja.css">
<style>
body{overflow:auto;background:radial-gradient(ellipse at top, #12305f, #06122a 70%)}
.home{max-width:1100px;margin:0 auto;padding:6vh 24px 40px}
.logo{font-size:64px;font-weight:900;letter-spacing:-.04em;margin:0}
.logo span{color:var(--accent)}
.channels{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px;margin-top:28px}
.ch{display:flex;flex-direction:column;justify-content:flex-end;min-height:190px;border-radius:24px;padding:20px;
  color:#fff;text-decoration:none;border:3px solid transparent;box-shadow:0 12px 40px rgba(0,0,0,.35);transition:transform .12s}
.ch:hover,.ch.focus{transform:translateY(-4px);border-color:#fff}
.ch .em{font-size:64px;line-height:1}
.ch .nm{font-size:28px;font-weight:900;margin-top:10px}
.ch .ds{font-size:15px;opacity:.85}
.ch.soon{filter:grayscale(.7);opacity:.55;cursor:default}
.ch.soon:hover{transform:none;border-color:transparent}
.plaza{display:flex;gap:10px;justify-content:center;margin-top:36px;flex-wrap:wrap}
.plaza canvas{width:64px;height:64px;animation:hop 1.6s ease-in-out infinite}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
</style>
</head>
<body>
<div class="home">
  <h1 class="logo">놀자 <span>🎮</span></h1>
  <div class="sub">거실 TV에서 조이콘 들고 같이 노는 게임 모음 · PC 크롬/엣지에서 열기</div>
  <div class="channels" id="channels"></div>
  <div class="plaza" id="plaza"></div>
  <p class="small center" style="margin-top:28px">←→ 고르기 · Enter 시작 · 조이콘 연결은 각 게임 메뉴에서</p>
</div>
<script src="shared/store.js"></script>
<script src="shared/characters.js"></script>
<script>
(() => {
  'use strict';
  // 게임 목록: 새 게임은 games/폴더명/index.html 만들고 여기에 한 줄 추가
  const GAMES = [
    { name: '테니스', emoji: '🎾', desc: '휘둘러서 치기 · 2인 대결', href: 'games/tennis/index.html', bg: 'linear-gradient(135deg,#1d4ed8,#0ea5e9)' },
    { name: '볼링', emoji: '🎳', desc: '곧 나와요', soon: true, bg: 'linear-gradient(135deg,#7c3aed,#c026d3)' },
    { name: '야구', emoji: '⚾', desc: '곧 나와요', soon: true, bg: 'linear-gradient(135deg,#15803d,#65a30d)' },
    { name: '레이싱', emoji: '🏎️', desc: '곧 나와요', soon: true, bg: 'linear-gradient(135deg,#b91c1c,#ea580c)' },
  ];
  const box = document.getElementById('channels');
  box.innerHTML = GAMES.map((g, i) => `<a class="ch${g.soon ? ' soon' : ''}" data-i="${i}" style="background:${g.bg}" ${g.soon ? '' : `href="${g.href}"`}>
    <div class="em">${g.emoji}</div><div class="nm">${g.name}</div><div class="ds">${g.desc}</div></a>`).join('');
  // 캐릭터 광장
  const plaza = document.getElementById('plaza');
  window.Nolja.characters.CHARS.forEach((ch, k) => {
    const c = document.createElement('canvas'); c.width = c.height = 128; c.style.animationDelay = (k * 0.18) + 's';
    window.Nolja.characters.portrait(c, ch); c.title = ch.name; plaza.appendChild(c);
  });
  // 키보드로 고르기
  let focus = 0;
  const tiles = [...box.querySelectorAll('.ch')];
  const show = () => tiles.forEach((t, i) => t.classList.toggle('focus', i === focus));
  show();
  window.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight') { focus = (focus + 1) % tiles.length; show(); }
    if (e.key === 'ArrowLeft') { focus = (focus - 1 + tiles.length) % tiles.length; show(); }
    if (e.key === 'Enter' && !GAMES[focus].soon) location.href = GAMES[focus].href;
  });
})();
</script>
</body>
</html>
